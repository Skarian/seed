<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed redesign mockup</title>
<style>
:root{--bg:#121311;--s1:#1a1c19;--s2:#23261f;--s3:#2c3027;--line:#30342b;--text:#ecebe4;--muted:#a3a69a;--accent:#c5e88a;--accent-ink:#17200b;--amber:#e8c36a;--red:#ef8a7a;--r:12px;--rt:10px;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:Georgia,"Iowan Old Style",serif;font-weight:500}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.app.inspect{grid-template-columns:248px 1fr 340px}
.rail{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-size:20px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.rail .btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);min-height:40px}.rail .btn.on{background:var(--s2);color:var(--text)}
.rail .label{font-size:12px;color:var(--muted);padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.newp{background:var(--s2)!important;color:var(--text)!important}
.spacer{flex:1}.gpu{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--muted)}.gpu b{color:var(--text);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.head{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.head h1{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:2px}.seg span{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted)}.seg .on{background:var(--s3);color:var(--text)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #c5e88a22}
.stream{flex:1;overflow:auto;padding:24px 20px 12px}.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.you{align-self:flex-end;background:var(--s2);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:80%}
.seed{color:var(--text)}.seed .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.statusline{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}.ch .k{background:var(--s3);border-radius:6px;padding:2px 8px;font-size:12px}
.drafts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.draft{background:var(--s1);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.draft .t{display:flex;align-items:center;gap:10px;font-weight:600}.cb{width:20px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:13px;flex:none}.cb.off{background:none;border:1.5px solid var(--muted)}
.draft p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.ready{font-size:12.5px;color:var(--accent)}.ready.warn{color:var(--amber)}
.changed{font-size:12.5px;color:var(--amber)}
.draft.off{opacity:.55}.more{margin-left:auto;color:var(--muted)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.tile{position:relative;border-radius:var(--rt);overflow:hidden;aspect-ratio:9/16;background:var(--s2)}.tile.l{aspect-ratio:16/9}
.art1{background:radial-gradient(circle at 30% 30%,#f2b36b55,transparent 40%),linear-gradient(160deg,#2b3a2f,#55402e 55%,#1d2419)}
.art2{background:radial-gradient(circle at 70% 35%,#ffd59b55,transparent 35%),linear-gradient(200deg,#2c2a3d,#4b3a2a 60%,#1b1a24)}
.art3{background:radial-gradient(circle at 50% 60%,#c5e88a33,transparent 45%),linear-gradient(120deg,#203a3a,#2d2a40)}
.art4{background:linear-gradient(180deg,#3a2c22,#7a5a3a 50%,#2a2018)}
.tile .bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}.pill{background:#121311cc;backdrop-filter:blur(6px);border-radius:999px;padding:5px 10px;font-size:12.5px}
.prog{position:absolute;inset:auto 0 0 0;height:3px;background:#0004}.prog i{display:block;height:100%;width:42%;background:var(--accent)}
.tile .state{position:absolute;top:8px;left:8px}
.notnow{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:10px}.notnow b{color:var(--text);font-weight:500}
.sys{align-self:center;font-size:12.5px;color:var(--muted)}
.dock{padding:10px 20px 16px;border-top:1px solid var(--line);background:var(--bg)}.dock .col{gap:8px}
.makebar{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}.makebar .sum{color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:9px;padding:9px 16px;min-height:40px;white-space:nowrap}.makebar .primary{margin-left:auto}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 14px;min-height:40px}
.composer{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}.tools{display:flex;align-items:center;gap:8px}
.ctx{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap}.ctx .x{color:var(--muted)}
.ctx img,.ctx .th{width:20px;height:20px;border-radius:4px}
.input{color:var(--muted);padding:4px 6px;min-height:24px}
.icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}.send{background:var(--accent);color:var(--accent-ink)}
.modes{display:inline-flex;font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.modes span{padding:4px 9px;color:var(--muted)}.modes .on{background:var(--s3);color:var(--text)}
.inspector{border-left:1px solid var(--line);background:var(--s1);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.inspector h2{margin:0;font-size:16px}.acts{display:flex;flex-wrap:wrap;gap:8px}
.kv{font-size:13px;color:var(--muted);display:grid;grid-template-columns:90px 1fr;gap:6px 10px}.kv b{color:var(--text);font-weight:500}
.inputs{display:flex;gap:8px}.in{width:56px}.in .tile{aspect-ratio:1}.in small{font-size:11px;color:var(--muted)}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.opt.on{border-color:var(--accent)}.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}.opt.on .radio{border:5px solid var(--accent)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.note{font-size:13px;color:var(--muted)}
.libbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:200px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.day{font-size:13px;color:var(--muted);margin:16px 0 8px}
.tabbar,.phonehead,.back{display:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* tablet */
@media (max-width:1099px){.app,.app.inspect{grid-template-columns:64px 1fr}.rail .txt,.rail .label,.gpu,.brand span{display:none}.inspector{position:fixed;right:0;top:0;bottom:0;width:420px;box-shadow:-20px 0 40px #0008}}
@media (max-width:899px){.drafts{grid-template-columns:1fr}}
/* phone */
@media (max-width:699px){.back{display:grid;font-size:24px;width:32px}.ch .more{font-size:0}.ch .more::after{content:"⋯";font-size:15px}.app,.app.inspect{grid-template-columns:1fr}.rail{display:none}.head{padding:10px 12px;flex-wrap:wrap}.head h1{font-size:17px;flex:1}.head .seg{order:3;width:100%;justify-content:stretch}.head .seg span{flex:1;text-align:center}.status .txt{display:none}.stream{padding:14px 12px}.dock{padding:8px 10px 12px}.you{max-width:88%}.inspector{width:100%}.results{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.libbar{padding:10px 12px}
.app.top .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--s1);border-top:1px solid var(--line)}.tabbar span{flex:1;display:grid;place-items:center;font-size:12px;color:var(--muted)}.tabbar .on{color:var(--accent)}.app.top .main{padding-bottom:60px}.compare{grid-template-columns:1fr}.makebar .sum .long{display:none}}
</style></head><body>
<div id="root"></div>
<script>
const s=new URLSearchParams(location.search).get('screen')||'project';
const I={check:'✓',more:'⋯',send:'▸',tune:'⫶',back:'‹'};
const rail=`<nav class="rail"><div class="brand serif"><span class="dot"></span><span>seed</span></div>
<button class="btn newp">＋ <span class="txt">New project</span></button>
<div class="label">Projects</div>
<button class="btn ${s!=='library'?'on':''}"><span class="live"></span><span class="txt">Moss &amp; Kettle</span></button>
<button class="btn"><span class="txt">○ Moonseed posters</span></button><button class="btn"><span class="txt">○ Logo ideas</span></button>
<div class="label"></div><button class="btn ${s==='library'?'on':''}">▣ <span class="txt">Library</span></button>
<div class="spacer"></div><div class="gpu"><b>1 GPU on</b> · RTX 4090<br>$0.42/h · idle release 15 min</div><button class="btn">⚙ <span class="txt">Settings</span></button></nav>`;
const head=(tab)=>`<header class="head"><button class="icon back">‹</button><h1 class="serif">Moss &amp; Kettle postcards</h1><div class="seg"><span class="${tab==='c'?'on':''}">Conversation</span><span class="${tab==='r'?'on':''}">Results</span></div><button class="status"><span class="live"></span><span>2 making</span><span class="txt">· GPU $0.42/h</span> ▾</button></header>`;
const draft=(t,p,c,on=true,extra='')=>`<div class="draft ${on?'':'off'}"><div class="t"><span class="cb ${on?'':'off'}">${on?I.check:''}</span>${t}<span class="more">${I.more}</span></div><p>${p}</p><div class="chips">${c.map(x=>`<span class="chip">${x}</span>`).join('')}</div>${extra}</div>`;
const plan=`<div class="card"><div class="ch"><b>Plan</b><span class="k">Image</span><span style="color:var(--muted)">4 drafts</span><span class="more">Discard plan</span></div><div class="drafts">
${draft('Storefront in the rain','A small tea shop at dusk in soft rain, warm amber window light spilling onto wet cobbles, hand-painted gouache, muted greens.',['Portrait 9:16','1080p','×2','Style: Watercolor study','This PC'],true,'<span class="ready">● Ready on This PC</span>')}
${draft('Cat on the sill','A ginger cat asleep on the shop windowsill beside a steaming teacup, hand-painted gouache, warm light.',['Portrait 9:16','1080p','×1','This PC'],true,'<span class="changed">What changed: 2 → 1 image · added: no lettering</span><span class="ready">● Ready on This PC</span>')}
${draft('Teapot close-up','Close-up of a cast-iron teapot on a wooden counter, steam curling, gouache texture.',['Portrait 9:16','1080p','×2'],false,'<span class="ready">● Ready on This PC</span>')}
${draft('Hanging sign','The shop sign "Moss & Kettle" hanging from an iron bracket, rain droplets, painted.',['Portrait 9:16','1080p','×2','This PC'],true,'<span class="ready">● Ready on This PC</span>')}
</div></div>`;
const dockPlan=`<div class="dock"><div class="col"><div class="makebar"><b>Make 5 images</b><span class="sum">· 3 of 4 drafts <span class="long">· This PC · no rental fee</span></span><button class="primary">▶ Make</button></div><div class="composer"><div class="input">Ask Seed to change the plan…</div><div class="tools"><span class="ctx">✎ Revising plan <span class="x">×</span></span><span class="icon">＋</span><span style="flex:1"></span><span class="modes"><span class="on">Ask</span><span>Make</span></span><span class="icon send">${I.send}</span></div></div></div></div>`;
const results=`<div class="card"><div class="ch"><b>Storefront in the rain</b><span class="k">Image</span><span style="color:var(--muted)">2 of 2 · done</span><span class="more">How it was made ▾</span></div><div class="results"><div class="tile art1"><div class="bar"><span class="pill">Refine</span><span class="pill">Variations</span><span class="pill">Animate</span><span class="pill">${I.more}</span></div></div><div class="tile art2"></div></div></div>
<div class="card"><div class="ch"><b>Hanging sign</b><span class="k">Image</span><span style="color:var(--muted)">making 1 of 2</span><span class="more">Cancel</span></div><div class="results"><div class="tile art4"></div><div class="tile" style="background:var(--s2)"><span class="state pill">Making · 42%</span><div class="prog"><i></i></div></div></div><div class="notnow"><span>Not now:</span><b>Teapot close-up</b><button style="color:var(--accent)">Bring back</button></div></div>`;
const stream=(body)=>`<div class="stream"><div class="col">${body}</div></div>`;
const convo=`<div class="you">I'm making four postcards for a made-up tea shop called Moss &amp; Kettle. Cozy, hand-painted, muted greens and warm amber light.</div>
<div class="seed"><div class="who">Seed</div>Here's a plan for four postcards in one consistent gouache style. I kept them portrait so they work as postcards. Uncheck any you want to hold back.</div>`;
let html='';
if(s==='project'){html=`<div class="app">${rail}<main class="main">${head('c')}${stream(convo+plan)}${dockPlan}</main></div>`;}
if(s==='running'||s==='inspect'){html=`<div class="app ${s==='inspect'?'inspect':''}">${rail}<main class="main">${head('c')}${stream(convo+'<div class="sys">GPU started · RTX 4090 · $0.42/h</div>'+results+'<div class="you">While those render — what would make the sign feel more hand-lettered?</div><div class="seed"><div class="who">Seed</div><span class="statusline"><span class="live"></span>Thinking… 12s</span></div>')}<div class="dock"><div class="col"><div class="composer"><div class="input">Ask Seed, or describe what to make…</div><div class="tools"><span class="ctx">💬 Talking with Seed</span><span class="icon">＋</span><span style="flex:1"></span><span class="modes"><span class="on">Ask</span><span>Make</span></span><span class="icon">■</span></div></div></div></div></main>${s==='inspect'?`<aside class="inspector"><div class="tile art1" style="aspect-ratio:9/16"></div><h2>Storefront in the rain · 1 of 2</h2><div class="acts"><button class="primary">Refine</button><button class="ghost">Variations</button><button class="ghost">Animate</button><button class="ghost">${I.more}</button></div>
<div class="kv"><span>Prompt</span><b>A small tea shop at dusk in soft rain, warm amber window light…</b><span>Kind</span><b>Image · Portrait 9:16 · 1080p</b><span>Style</span><b>Watercolor study · 0.8</b><span>Ran on</span><b>This PC · 22 s</b><span>Project</span><b>Moss &amp; Kettle ›</b></div></aside>`:''}</div>`;}
if(s==='compute'){html=`<div class="app">${rail}<main class="main">${head('c')}${stream(convo+plan)}<div class="dock"><div class="col"><div class="sheet"><b>This needs an image GPU.</b>
<div class="opt on"><span class="radio"></span><div><b>RTX 4090 · Vast</b> — $0.42/h<small>compute $0.39 + storage $0.03 · lowest hourly rate · startup time not known · model download not quoted</small></div></div>
<div class="opt"><span class="radio"></span><div><b>RTX 6000 Ada · RunPod</b> — $0.79/h<small>compute $0.74 + storage $0.05 · higher reliability</small></div></div>
<div class="opt"><span class="radio"></span><div><b>This PC</b><small>Not set up · about 91 GB download · Set up in Settings</small></div></div>
<div class="note">More machines… · Release when idle for <b>15 min ▾</b> · Closing Seed does not stop the GPU.</div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost">Back</button><button class="primary">Start GPU and make 5 images</button></div></div></div></div></main></div>`;}
if(s==='results'){html=`<div class="app">${rail}<main class="main">${head('r')}<div class="libbar"><div class="seg"><span class="on">All</span><span>♥ Favorites</span><span>Images</span><span>Videos</span></div><span class="note" style="margin-left:auto">2 selected</span><button class="primary">Compare</button></div>${stream(`<div class="compare"><div class="tile art1"><span class="state pill">Storefront · v1</span></div><div class="tile art2"><span class="state pill">Storefront · variation</span></div></div><div class="note" style="text-align:center">Linked zoom · ♥ Favorite either · Show in conversation</div>`)}</main></div>`;}
if(s==='library'){const tiles=['art1','art2','art3 l','art4','art2 l','art1','art3','art4 l','art1','art2'].map((a,i)=>`<div class="tile ${a}"></div>`).join('');html=`<div class="app top">${rail}<main class="main"><header class="head"><h1 class="serif">Library</h1></header><div class="libbar"><span class="search">⌕ Search prompts, titles, notes</span><div class="seg"><span class="on">All</span><span>Images</span><span>Videos</span><span>Audio</span></div><span class="chip">Made in Seed ▾</span><span class="chip">♥</span><span class="chip">Collections ▾</span><span class="chip">Project ▾</span><span class="chip">Newest ▾</span><button class="ghost">Select</button></div>${stream(`<div><div class="day">Today</div><div class="grid">${tiles}</div><div class="day">Yesterday</div><div class="grid">${tiles.slice(0,300)}</div></div>`)}</main><nav class="tabbar"><span>Projects</span><span class="on">Library</span><span>GPUs</span><span>Settings</span></nav></div>`;}
if(s==='projects'){html=`<div class="app top">${rail}<main class="main"><header class="head"><h1 class="serif">Projects</h1><button class="status"><span class="live"></span>2 making ▾</button></header>${stream(`<button class="primary">＋ New project</button><div class="card"><div class="draft"><div class="t"><span class="live"></span>Moss &amp; Kettle postcards<span class="more">making 2</span></div><p>Plan ready · 3 results</p></div></div><div class="card"><div class="draft"><div class="t">Moonseed posters<span class="more">yesterday</span></div><p>8 results</p></div></div><div class="card"><div class="draft"><div class="t">Logo ideas<span class="more">Nov 1</span></div><p>4 results</p></div></div>`)}</main><nav class="tabbar"><span class="on">Projects</span><span>Library</span><span>GPUs</span><span>Settings</span></nav></div>`;}
if(s==='empty'){html=`<div class="app">${rail}<main class="main"><header class="head"><h1 class="serif">New project</h1><button class="status">No GPU on ▾</button></header><div class="stream" style="display:grid;place-items:center"><div class="col" style="align-items:center;text-align:center;max-width:560px"><h2 class="serif" style="font-size:30px;margin:0">What are we making?</h2><p class="note">Describe it in your own words. Seed plans it and asks before anything runs.</p><div class="chips" style="justify-content:center"><span class="chip">A set of four postcards</span><span class="chip">Turn a photo into a painting</span><span class="chip">A 5-second clip from an image</span><span class="chip">Logo options</span></div><p class="note">This PC is ready · no rental fee</p></div></div><div class="dock"><div class="col"><div class="composer"><div class="input">Ask Seed, or describe what to make…</div><div class="tools"><span class="ctx">💬 Talking with Seed</span><span class="icon">＋</span><span style="flex:1"></span><span class="modes"><span class="on">Ask</span><span>Make</span></span><span class="icon send">${I.send}</span></div></div></div></div></main></div>`;}
document.getElementById('root').innerHTML=html;
</script></body></html>
